<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>8×8 Turn-Based Board Game</title>
  <style>
    :root {
      --bg: #1a2332;
      --panel: #243044;
      --text: #e8eef7;
      --muted: #9aabbf;
      --accent: #3d9a8b;
      --accent-hover: #4cb5a4;
      --danger: #c45c5c;
      --light-sq: #c5d0de;
      --dark-sq: #3a4a5c;
      --dark-piece: #1c1410;
      --light-piece: #f3f0ea;
      --select: #f0c75e;
      --target: #5ecf8a;
      --must: #e07a3d;
      --path: #6ea8ff;
      --font: "Segoe UI", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(ellipse at 20% 0%, #2a3b52 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #1e3a36 0%, transparent 45%),
        var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem;
      gap: 1rem;
    }

    h1 {
      margin: 0;
      font-weight: 650;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 520px) minmax(220px, 280px);
      gap: 1.25rem;
      width: min(900px, 100%);
      align-items: start;
    }

    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
    }

    .board-wrap {
      background: var(--panel);
      border-radius: 12px;
      padding: 0.85rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1;
      border: 3px solid #15202e;
      border-radius: 6px;
      overflow: hidden;
      user-select: none;
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .square.light { background: var(--light-sq); }
    .square.dark { background: var(--dark-sq); cursor: pointer; }
    .square.selected { outline: 3px solid var(--select); outline-offset: -3px; }
    .square.target { box-shadow: inset 0 0 0 3px var(--target); }
    .square.must-capture { box-shadow: inset 0 0 0 3px var(--must); }
    .square.in-path { box-shadow: inset 0 0 0 3px var(--path); }

    .square .coord {
      position: absolute;
      left: 3px;
      bottom: 2px;
      font-size: 0.58rem;
      opacity: 0.45;
      pointer-events: none;
    }

    .piece {
      width: 68%;
      height: 68%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.7rem, 2.8vw, 1.1rem);
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s ease;
    }

    .piece.dark {
      background: radial-gradient(circle at 35% 30%, #3a2c24, var(--dark-piece));
      color: #f5d76e;
      border: 2px solid #0d0907;
    }

    .piece.light {
      background: radial-gradient(circle at 35% 30%, #fff, var(--light-piece));
      color: #2a3340;
      border: 2px solid #b8b0a4;
    }

    .piece.king::after { content: "♛"; }

    .side-panel {
      background: var(--panel);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      min-height: 100%;
    }

    .status-bar {
      background: #1b2738;
      border-radius: 8px;
      padding: 0.75rem 0.85rem;
      line-height: 1.45;
      font-size: 0.92rem;
    }

    .status-bar strong { color: var(--accent); }

    .hint {
      color: var(--muted);
      font-size: 0.82rem;
      margin: 0;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #06221e;
    }

    button:hover { background: var(--accent-hover); }
    button.secondary { background: #3a4d66; color: var(--text); }
    button.secondary:hover { background: #4a6080; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .history {
      flex: 1;
      background: #1b2738;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      max-height: 280px;
      overflow: auto;
      font-size: 0.85rem;
    }

    .history h2 {
      margin: 0 0 0.4rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 650;
    }

    .history ol {
      margin: 0;
      padding-left: 1.2rem;
    }

    .history li { margin: 0.15rem 0; }
    .legend { font-size: 0.78rem; color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <h1>Dark-Square Duel</h1>
  <p class="subtitle">Two-player turn-based game on an 8×8 board · Official rules engine</p>

  <div class="layout">
    <div class="board-wrap">
      <div id="board" class="board" aria-label="Game board"></div>
    </div>
    <aside class="side-panel">
      <div id="status" class="status-bar" aria-live="polite"></div>
      <p id="hint" class="hint"></p>
      <div class="controls">
        <button id="btn-new" type="button">New Game</button>
        <button id="btn-undo" class="secondary" type="button">Undo</button>
      </div>
      <div class="history">
        <h2>Move history</h2>
        <ol id="history-list"></ol>
      </div>
      <p class="legend">
        Dark moves first · Orange = must capture · Green = legal target · Crown = king
      </p>
    </aside>
  </div>

<script>
/**
 * =============================================================================
 * ARCHITECTURE
 * -----------------------------------------------------------------------------
 * Self-contained HTML implementation of OFFICIAL_RULES.md.
 *
 * Eight decoupled ES6 modules (classes), wired bottom-up:
 *
 *   1. Constants      — players, piece kinds, directions, draw limits
 *   2. BoardUtils     — coordinates, playable squares, notation helpers
 *   3. GameState      — mutable board + turn + counters + clone/snapshot
 *   4. MoveGenerator  — quiet moves + capture paths (mandatory multi-jumps)
 *   5. MoveValidator  — legal-move checks + UI selection rules
 *   6. GameEngine     — apply moves, promotion, win/draw, undo stack
 *   7. UIRenderer     — paint board, highlights, status, history
 *   8. UIEventHandlers— click / button interactions + multi-jump lock
 *
 * Data flows one way: UI events → Engine → State; Renderer only reads state.
 * Captures are mandatory. Multi-jumps must be completed. Mid-turn promotion
 * does not grant backward jumps until a later turn.
 * =============================================================================
 */

/* ============================================================================
 * MODULE 1 — Constants
 * ========================================================================== */

/**
 * Immutable rules constants shared by every module.
 */
class Constants {
  /** @returns {string} Player 1 identifier */
  static get DARK() { return "dark"; }

  /** @returns {string} Player 2 identifier */
  static get LIGHT() { return "light"; }

  /** @returns {string} Standard piece type */
  static get MAN() { return "man"; }

  /** @returns {string} King piece type */
  static get KING() { return "king"; }

  /** @returns {number} Board width/height */
  static get SIZE() { return 8; }

  /** @returns {number} Forty-move draw threshold */
  static get FORTY_MOVE_LIMIT() { return 40; }

  /** @returns {number} Threefold repetition threshold */
  static get THREEFOLD_LIMIT() { return 3; }

  /**
   * All four diagonal step vectors [colDelta, rowDelta].
   * @returns {ReadonlyArray<ReadonlyArray<number>>}
   */
  static get DIAGONALS() {
    return Object.freeze([
      Object.freeze([-1, 1]),
      Object.freeze([1, 1]),
      Object.freeze([-1, -1]),
      Object.freeze([1, -1]),
    ]);
  }

  /** @returns {string} Column labels a–h */
  static get FILES() { return "abcdefgh"; }

  /** @returns {string} In-progress status */
  static get STATUS_PLAYING() { return "playing"; }

  /** @returns {string} Dark win status */
  static get STATUS_DARK_WINS() { return "dark_wins"; }

  /** @returns {string} Light win status */
  static get STATUS_LIGHT_WINS() { return "light_wins"; }

  /** @returns {string} Draw status */
  static get STATUS_DRAW() { return "draw"; }
}

/* ============================================================================
 * MODULE 2 — BoardUtils
 * ========================================================================== */

/**
 * Pure helpers for squares, notation, and player geometry.
 * No side effects; does not hold game state.
 */
class BoardUtils {
  /**
   * @param {number} col Zero-based column (0 = a)
   * @param {number} row Zero-based row (0 = rank 1)
   * @returns {boolean} True when the square is on the board
   */
  static onBoard(col, row) {
    const size = Constants.SIZE;
    return col >= 0 && col < size && row >= 0 && row < size;
  }

  /**
   * Dark squares are playable; a1 (0,0) is dark.
   * @param {number} col
   * @param {number} row
   * @returns {boolean}
   */
  static isPlayable(col, row) {
    return BoardUtils.onBoard(col, row) && (col + row) % 2 === 0;
  }

  /**
   * @param {number} col
   * @param {number} row
   * @returns {string} Algebraic square, e.g. "c3"
   */
  static formatSquare(col, row) {
    return `${Constants.FILES[col]}${row + 1}`;
  }

  /**
   * @param {string} text Algebraic square
   * @returns {{col:number, row:number}}
   */
  static parseSquare(text) {
    const normalized = String(text).trim().toLowerCase();
    const col = Constants.FILES.indexOf(normalized[0]);
    const row = Number(normalized[1]) - 1;
    if (!BoardUtils.isPlayable(col, row)) {
      throw new Error(`Invalid playable square: ${text}`);
    }
    return { col, row };
  }

  /**
   * @param {{col:number, row:number}} square
   * @returns {string} Key used in the piece map
   */
  static key(square) {
    return `${square.col},${square.row}`;
  }

  /**
   * @param {string} key Map key from {@link BoardUtils.key}
   * @returns {{col:number, row:number}}
   */
  static fromKey(key) {
    const [colText, rowText] = key.split(",");
    return { col: Number(colText), row: Number(rowText) };
  }

  /**
   * Forward row delta for a player (+1 dark, −1 light).
   * @param {string} player
   * @returns {number}
   */
  static forwardDelta(player) {
    return player === Constants.DARK ? 1 : -1;
  }

  /**
   * Promotion row index for a player.
   * @param {string} player
   * @returns {number}
   */
  static promotionRow(player) {
    return player === Constants.DARK ? 7 : 0;
  }

  /**
   * Opponent of the given player.
   * @param {string} player
   * @returns {string}
   */
  static opponent(player) {
    return player === Constants.DARK ? Constants.LIGHT : Constants.DARK;
  }

  /**
   * Forward-only diagonal directions for a standard piece.
   * @param {string} player
   * @returns {ReadonlyArray<ReadonlyArray<number>>}
   */
  static forwardDiagonals(player) {
    const forward = BoardUtils.forwardDelta(player);
    return Constants.DIAGONALS.filter(([, rowDelta]) => rowDelta === forward);
  }

  /**
   * Build move notation from a move object.
   * @param {{start:object, path:object[], isCapture:boolean}} move
   * @returns {string}
   */
  static moveNotation(move) {
    const start = BoardUtils.formatSquare(move.start.col, move.start.row);
    if (!move.isCapture) {
      const end = move.path[0];
      return `${start}-${BoardUtils.formatSquare(end.col, end.row)}`;
    }
    const lands = move.path.map((sq) => BoardUtils.formatSquare(sq.col, sq.row));
    return [start, ...lands].join("x");
  }

  /**
   * Compare two square objects.
   * @param {{col:number, row:number}|null} a
   * @param {{col:number, row:number}|null} b
   * @returns {boolean}
   */
  static sameSquare(a, b) {
    return Boolean(a && b && a.col === b.col && a.row === b.row);
  }
}

/* ============================================================================
 * MODULE 3 — GameState
 * ========================================================================== */

/**
 * Holds the mutable official game state (board, turn, counters, status).
 */
class GameState {
  /**
   * Creates initial or restored state.
   * @param {object} [snapshot] Optional snapshot from {@link GameState#clone}
   */
  constructor(snapshot = null) {
    if (snapshot) {
      this.#restore(snapshot);
      return;
    }
    this.pieces = GameState.#buildInitialPieces();
    this.sideToMove = Constants.DARK;
    this.fortyMoveCounter = 0;
    this.positionHistory = [this.fingerprint()];
    this.status = Constants.STATUS_PLAYING;
    this.drawReason = null;
    this.moveLog = [];
  }

  /**
   * Place twelve dark + twelve light men per Section 4.
   * @returns {Map<string, {owner:string, kind:string}>}
   * @private
   */
  static #buildInitialPieces() {
    const pieces = new Map();
    for (let row = 0; row < 3; row += 1) {
      GameState.#fillRow(pieces, row, Constants.DARK);
    }
    for (let row = 5; row < 8; row += 1) {
      GameState.#fillRow(pieces, row, Constants.LIGHT);
    }
    return pieces;
  }

  /**
   * @param {Map<string, object>} pieces
   * @param {number} row
   * @param {string} owner
   * @returns {void}
   * @private
   */
  static #fillRow(pieces, row, owner) {
    for (let col = 0; col < Constants.SIZE; col += 1) {
      if (!BoardUtils.isPlayable(col, row)) continue;
      pieces.set(BoardUtils.key({ col, row }), { owner, kind: Constants.MAN });
    }
  }

  /**
   * @param {object} snapshot
   * @returns {void}
   * @sideEffects Restores all fields from snapshot
   * @private
   */
  #restore(snapshot) {
    this.pieces = new Map(
      snapshot.pieces.map(([key, piece]) => [key, { ...piece }])
    );
    this.sideToMove = snapshot.sideToMove;
    this.fortyMoveCounter = snapshot.fortyMoveCounter;
    this.positionHistory = [...snapshot.positionHistory];
    this.status = snapshot.status;
    this.drawReason = snapshot.drawReason;
    this.moveLog = [...snapshot.moveLog];
  }

  /**
   * Deep-enough clone for undo / simulation.
   * @returns {GameState}
   */
  clone() {
    return new GameState(this.toSnapshot());
  }

  /**
   * Serializable snapshot used by undo.
   * @returns {object}
   */
  toSnapshot() {
    return {
      pieces: [...this.pieces.entries()].map(([key, piece]) => [key, { ...piece }]),
      sideToMove: this.sideToMove,
      fortyMoveCounter: this.fortyMoveCounter,
      positionHistory: [...this.positionHistory],
      status: this.status,
      drawReason: this.drawReason,
      moveLog: [...this.moveLog],
    };
  }

  /**
   * @param {{col:number, row:number}} square
   * @returns {{owner:string, kind:string}|null}
   */
  getPiece(square) {
    return this.pieces.get(BoardUtils.key(square)) || null;
  }

  /**
   * @param {{col:number, row:number}} square
   * @param {{owner:string, kind:string}|null} piece
   * @returns {void}
   * @sideEffects Mutates the piece map
   */
  setPiece(square, piece) {
    const mapKey = BoardUtils.key(square);
    if (piece) this.pieces.set(mapKey, piece);
    else this.pieces.delete(mapKey);
  }

  /**
   * @param {string} player
   * @returns {number}
   */
  countPieces(player) {
    let total = 0;
    for (const piece of this.pieces.values()) {
      if (piece.owner === player) total += 1;
    }
    return total;
  }

  /**
   * @param {string} player
   * @returns {Array<{square:object, piece:object}>}
   */
  piecesFor(player) {
    const list = [];
    for (const [mapKey, piece] of this.pieces.entries()) {
      if (piece.owner !== player) continue;
      list.push({ square: BoardUtils.fromKey(mapKey), piece });
    }
    return list;
  }

  /**
   * Position fingerprint for threefold repetition (board + side to move).
   * @returns {string}
   */
  fingerprint() {
    const cells = [...this.pieces.entries()]
      .sort(([a], [b]) => (a < b ? -1 : 1))
      .map(([key, piece]) => `${key}:${piece.owner}:${piece.kind}`)
      .join("|");
    return `${cells}#${this.sideToMove}`;
  }

  /** @returns {boolean} */
  get isPlaying() {
    return this.status === Constants.STATUS_PLAYING;
  }
}

/* ============================================================================
 * MODULE 4 — MoveGenerator
 * ========================================================================== */

/**
 * Generates quiet moves and complete capture paths per the official rules.
 */
class MoveGenerator {
  /**
   * Legal turns for the side to move: captures if any, else quiet moves.
   * @param {GameState} state
   * @param {string} [player] Defaults to state.sideToMove
   * @returns {Array<object>}
   */
  static legalMoves(state, player = state.sideToMove) {
    const captures = MoveGenerator.captureMoves(state, player);
    if (captures.length > 0) return captures;
    return MoveGenerator.quietMoves(state, player);
  }

  /**
   * @param {GameState} state
   * @param {string} player
   * @returns {Array<object>}
   */
  static quietMoves(state, player) {
    const moves = [];
    for (const { square, piece } of state.piecesFor(player)) {
      MoveGenerator.#appendQuietFrom(state, square, piece, moves);
    }
    return moves;
  }

  /**
   * @param {GameState} state
   * @param {object} start
   * @param {object} piece
   * @param {Array<object>} moves
   * @returns {void}
   * @sideEffects Pushes into moves
   * @private
   */
  static #appendQuietFrom(state, start, piece, moves) {
    for (const [colDelta, rowDelta] of MoveGenerator.#quietDirs(piece)) {
      const land = { col: start.col + colDelta, row: start.row + rowDelta };
      if (!BoardUtils.onBoard(land.col, land.row)) continue;
      if (state.getPiece(land)) continue;
      moves.push({
        start: { ...start },
        path: [land],
        captures: [],
        isCapture: false,
      });
    }
  }

  /**
   * @param {object} piece
   * @returns {ReadonlyArray<ReadonlyArray<number>>}
   * @private
   */
  static #quietDirs(piece) {
    if (piece.kind === Constants.KING) return Constants.DIAGONALS;
    return BoardUtils.forwardDiagonals(piece.owner);
  }

  /**
   * All complete (maximal) capture paths for a player.
   * @param {GameState} state
   * @param {string} player
   * @returns {Array<object>}
   */
  static captureMoves(state, player) {
    const results = [];
    for (const { square, piece } of state.piecesFor(player)) {
      const wasKing = piece.kind === Constants.KING;
      MoveGenerator.#exploreCaptures(
        state, square, square, piece, wasKing, [], [], results
      );
    }
    return results;
  }

  /**
   * Depth-first search of capture continuations; records only terminal paths.
   * @param {GameState} state
   * @param {object} start
   * @param {object} current
   * @param {object} piece
   * @param {boolean} wasKingAtTurnStart
   * @param {object[]} path
   * @param {object[]} captured
   * @param {object[]} results
   * @returns {void}
   * @sideEffects Mutates results
   * @private
   */
  static #exploreCaptures(
    state, start, current, piece, wasKingAtTurnStart, path, captured, results
  ) {
    const jumps = MoveGenerator.#jumpsFrom(
      state, current, piece, wasKingAtTurnStart, captured
    );
    if (jumps.length === 0) {
      if (path.length > 0) {
        results.push({
          start: { ...start },
          path: path.map((sq) => ({ ...sq })),
          captures: captured.map((sq) => ({ ...sq })),
          isCapture: true,
        });
      }
      return;
    }
    for (const jump of jumps) {
      MoveGenerator.#recurseJump(
        state, start, current, piece, wasKingAtTurnStart,
        path, captured, jump, results
      );
    }
  }

  /**
   * Apply one jump on a clone and continue searching.
   * @returns {void}
   * @private
   */
  static #recurseJump(
    state, start, current, piece, wasKingAtTurnStart, path, captured, jump, results
  ) {
    const nextState = state.clone();
    const moving = { ...nextState.getPiece(current) };
    nextState.setPiece(current, null);
    nextState.setPiece(jump.over, null);
    const landed = MoveGenerator.#maybePromote(moving, jump.land);
    nextState.setPiece(jump.land, landed);
    MoveGenerator.#exploreCaptures(
      nextState,
      start,
      jump.land,
      landed,
      wasKingAtTurnStart,
      [...path, jump.land],
      [...captured, jump.over],
      results
    );
  }

  /**
   * Immediate promotion when landing on the home row.
   * @param {object} piece
   * @param {object} land
   * @returns {object}
   * @private
   */
  static #maybePromote(piece, land) {
    if (piece.kind === Constants.KING) return piece;
    if (land.row !== BoardUtils.promotionRow(piece.owner)) return piece;
    return { owner: piece.owner, kind: Constants.KING };
  }

  /**
   * Single-step jump options from a square.
   * @returns {Array<{over:object, land:object}>}
   * @private
   */
  static #jumpsFrom(state, square, piece, wasKingAtTurnStart, capturedAlready) {
    const jumps = [];
    const dirs = MoveGenerator.#jumpDirs(piece, wasKingAtTurnStart);
    for (const [colDelta, rowDelta] of dirs) {
      const jump = MoveGenerator.#tryJump(
        state, square, piece, colDelta, rowDelta, capturedAlready
      );
      if (jump) jumps.push(jump);
    }
    return jumps;
  }

  /**
   * Directions allowed for jumps this turn (Section 6.7 / 8.2).
   * @returns {ReadonlyArray<ReadonlyArray<number>>}
   * @private
   */
  static #jumpDirs(piece, wasKingAtTurnStart) {
    if (piece.kind === Constants.KING && wasKingAtTurnStart) {
      return Constants.DIAGONALS;
    }
    return BoardUtils.forwardDiagonals(piece.owner);
  }

  /**
   * @returns {{over:object, land:object}|null}
   * @private
   */
  static #tryJump(state, square, piece, colDelta, rowDelta, capturedAlready) {
    const over = {
      col: square.col + colDelta,
      row: square.row + rowDelta,
    };
    const land = {
      col: square.col + 2 * colDelta,
      row: square.row + 2 * rowDelta,
    };
    if (!BoardUtils.onBoard(land.col, land.row)) return null;
    const victim = state.getPiece(over);
    if (!victim || victim.owner === piece.owner) return null;
    if (capturedAlready.some((sq) => BoardUtils.sameSquare(sq, over))) return null;
    if (state.getPiece(land)) return null;
    return { over, land };
  }
}

/* ============================================================================
 * MODULE 5 — MoveValidator
 * ========================================================================== */

/**
 * Validates moves and click-selection steps against generated legal turns.
 */
class MoveValidator {
  /**
   * @param {object} move Candidate move
   * @param {Array<object>} legalMoves
   * @returns {boolean}
   */
  static isLegalMove(move, legalMoves) {
    const notation = BoardUtils.moveNotation(move);
    return legalMoves.some((legal) => BoardUtils.moveNotation(legal) === notation);
  }

  /**
   * Whether any mandatory captures exist for the side to move.
   * @param {GameState} state
   * @returns {boolean}
   */
  static hasMandatoryCaptures(state) {
    return MoveGenerator.captureMoves(state, state.sideToMove).length > 0;
  }

  /**
   * Squares that currently hold pieces able to capture.
   * @param {Array<object>} legalMoves
   * @returns {object[]}
   */
  static capturableStarts(legalMoves) {
    const starts = [];
    for (const move of legalMoves) {
      if (!move.isCapture) continue;
      if (starts.some((sq) => BoardUtils.sameSquare(sq, move.start))) continue;
      starts.push({ ...move.start });
    }
    return starts;
  }

  /**
   * Legal moves that begin at start and match the partial landing path so far.
   * @param {Array<object>} legalMoves
   * @param {object} start
   * @param {object[]} partialPath
   * @returns {Array<object>}
   */
  static matchingMoves(legalMoves, start, partialPath) {
    return legalMoves.filter((move) => {
      if (!BoardUtils.sameSquare(move.start, start)) return false;
      if (partialPath.length > move.path.length) return false;
      return partialPath.every((sq, index) =>
        BoardUtils.sameSquare(sq, move.path[index])
      );
    });
  }

  /**
   * Next landing squares still available given a partial multi-jump.
   * @param {Array<object>} legalMoves
   * @param {object} start
   * @param {object[]} partialPath
   * @returns {object[]}
   */
  static nextLandingSquares(legalMoves, start, partialPath) {
    const matches = MoveValidator.matchingMoves(legalMoves, start, partialPath);
    const nextIndex = partialPath.length;
    const lands = [];
    for (const move of matches) {
      if (nextIndex >= move.path.length) continue;
      const land = move.path[nextIndex];
      if (!lands.some((sq) => BoardUtils.sameSquare(sq, land))) {
        lands.push({ ...land });
      }
    }
    return lands;
  }

  /**
   * True when the partial path uniquely completes one legal move.
   * @param {Array<object>} legalMoves
   * @param {object} start
   * @param {object[]} partialPath
   * @returns {object|null}
   */
  static completedMove(legalMoves, start, partialPath) {
    const matches = MoveValidator.matchingMoves(legalMoves, start, partialPath);
    const finished = matches.filter((move) => move.path.length === partialPath.length);
    if (finished.length === 1) return finished[0];
    return null;
  }

  /**
   * Quiet destinations from a selected piece (only when captures are absent).
   * @param {Array<object>} legalMoves
   * @param {object} start
   * @returns {object[]}
   */
  static quietTargetsFrom(legalMoves, start) {
    const targets = [];
    for (const move of legalMoves) {
      if (move.isCapture) continue;
      if (!BoardUtils.sameSquare(move.start, start)) continue;
      targets.push({ ...move.path[0] });
    }
    return targets;
  }
}

/* ============================================================================
 * MODULE 6 — GameEngine
 * ========================================================================== */

/**
 * Applies legal turns, handles promotion / win / draw, and supports undo.
 */
class GameEngine {
  /**
   * @param {GameState} [state]
   */
  constructor(state = new GameState()) {
    this.state = state;
    this.undoStack = [];
  }

  /** @returns {Array<object>} */
  legalMoves() {
    if (!this.state.isPlaying) return [];
    return MoveGenerator.legalMoves(this.state);
  }

  /**
   * Start a fresh game.
   * @returns {void}
   * @sideEffects Resets state and clears undo
   */
  newGame() {
    this.state = new GameState();
    this.undoStack = [];
  }

  /**
   * Apply a complete legal move object.
   * @param {object} move
   * @returns {void}
   * @sideEffects Mutates state; pushes undo snapshot
   */
  play(move) {
    if (!this.state.isPlaying) throw new Error("Game is over");
    const legal = this.legalMoves();
    if (!MoveValidator.isLegalMove(move, legal)) {
      throw new Error(`Illegal move: ${BoardUtils.moveNotation(move)}`);
    }
    this.undoStack.push(this.state.toSnapshot());
    this.#executeMove(move);
    this.#afterMoveChecks();
  }

  /**
   * Undo the last completed turn, if any.
   * @returns {boolean} True when a turn was undone
   * @sideEffects Restores previous state
   */
  undo() {
    if (this.undoStack.length === 0) return false;
    this.state = new GameState(this.undoStack.pop());
    return true;
  }

  /**
   * Core board mutation for one turn.
   * @param {object} move
   * @returns {void}
   * @private
   */
  #executeMove(move) {
    const moving = this.state.getPiece(move.start);
    const wasMan = moving.kind === Constants.MAN;
    this.state.setPiece(move.start, null);
    for (const captured of move.captures) {
      this.state.setPiece(captured, null);
    }
    let piece = { ...moving };
    for (const land of move.path) {
      piece = this.#promoteIfNeeded(piece, land);
    }
    this.state.setPiece(move.path[move.path.length - 1], piece);
    this.#updateFortyMoveCounter(move, wasMan);
    this.state.moveLog.push(BoardUtils.moveNotation(move));
    this.state.sideToMove = BoardUtils.opponent(this.state.sideToMove);
    this.state.positionHistory.push(this.state.fingerprint());
  }

  /**
   * @param {object} piece
   * @param {object} land
   * @returns {object}
   * @private
   */
  #promoteIfNeeded(piece, land) {
    if (piece.kind === Constants.KING) return piece;
    if (land.row !== BoardUtils.promotionRow(piece.owner)) return piece;
    return { owner: piece.owner, kind: Constants.KING };
  }

  /**
   * @param {object} move
   * @param {boolean} wasMan
   * @returns {void}
   * @private
   */
  #updateFortyMoveCounter(move, wasMan) {
    if (move.isCapture || (wasMan && !move.isCapture)) {
      this.state.fortyMoveCounter = 0;
    } else {
      this.state.fortyMoveCounter += 1;
    }
  }

  /**
   * Detect wins and draws after a completed turn.
   * @returns {void}
   * @private
   */
  #afterMoveChecks() {
    const toMove = this.state.sideToMove;
    if (this.state.countPieces(toMove) === 0) {
      this.#setWinner(BoardUtils.opponent(toMove));
      return;
    }
    if (this.#isThreefold()) {
      this.state.status = Constants.STATUS_DRAW;
      this.state.drawReason = "threefold repetition";
      return;
    }
    if (this.state.fortyMoveCounter >= Constants.FORTY_MOVE_LIMIT) {
      this.state.status = Constants.STATUS_DRAW;
      this.state.drawReason = "forty-move rule";
      return;
    }
    if (MoveGenerator.legalMoves(this.state, toMove).length === 0) {
      this.#setWinner(BoardUtils.opponent(toMove));
    }
  }

  /**
   * @returns {boolean}
   * @private
   */
  #isThreefold() {
    const latest = this.state.fingerprint();
    const count = this.state.positionHistory.filter((item) => item === latest).length;
    return count >= Constants.THREEFOLD_LIMIT;
  }

  /**
   * @param {string} winner
   * @returns {void}
   * @private
   */
  #setWinner(winner) {
    this.state.status = winner === Constants.DARK
      ? Constants.STATUS_DARK_WINS
      : Constants.STATUS_LIGHT_WINS;
  }
}

/* ============================================================================
 * MODULE 7 — UIRenderer
 * ========================================================================== */

/**
 * Renders board, highlights, status bar, and move history from engine state.
 */
class UIRenderer {
  /**
   * @param {object} elements DOM element map
   */
  constructor(elements) {
    this.elements = elements;
  }

  /**
   * Full refresh of all UI surfaces.
   * @param {GameEngine} engine
   * @param {object} selection UI selection model
   * @returns {void}
   * @sideEffects Rewrites DOM contents
   */
  render(engine, selection) {
    const legalMoves = engine.legalMoves();
    const viewState = this.#viewStateForSelection(engine.state, selection, legalMoves);
    this.renderBoard(viewState, selection, legalMoves);
    this.renderStatus(engine.state, selection, legalMoves);
    this.renderHistory(engine.state);
    this.elements.undoButton.disabled = engine.undoStack.length === 0;
  }

  /**
   * Temporary board view while a multi-jump is being clicked through.
   * @param {GameState} state
   * @param {object} selection
   * @param {Array<object>} legalMoves
   * @returns {GameState}
   * @private
   */
  #viewStateForSelection(state, selection, legalMoves) {
    if (!selection.multiJumpActive || selection.partialPath.length === 0) return state;
    const matches = MoveValidator.matchingMoves(
      legalMoves, selection.selected, selection.partialPath
    );
    if (matches.length === 0) return state;
    return this.#previewPartialCapture(state, matches[0], selection.partialPath.length);
  }

  /**
   * @param {GameState} state
   * @param {object} move
   * @param {number} stepsCompleted
   * @returns {GameState}
   * @private
   */
  #previewPartialCapture(state, move, stepsCompleted) {
    const preview = state.clone();
    const piece = preview.getPiece(move.start);
    preview.setPiece(move.start, null);
    for (let index = 0; index < stepsCompleted; index += 1) {
      preview.setPiece(move.captures[index], null);
    }
    const land = move.path[stepsCompleted - 1];
    let shown = { ...piece };
    for (let index = 0; index < stepsCompleted; index += 1) {
      const stepLand = move.path[index];
      if (shown.kind === Constants.MAN &&
          stepLand.row === BoardUtils.promotionRow(shown.owner)) {
        shown = { owner: shown.owner, kind: Constants.KING };
      }
    }
    preview.setPiece(land, shown);
    return preview;
  }

  /**
   * @param {GameState} state
   * @param {object} selection
   * @param {Array<object>} legalMoves
   * @returns {void}
   * @sideEffects Rebuilds board children
   */
  renderBoard(state, selection, legalMoves) {
    const boardEl = this.elements.board;
    boardEl.innerHTML = "";
    const highlight = this.#buildHighlightSet(selection, legalMoves);
    for (let row = 7; row >= 0; row -= 1) {
      for (let col = 0; col < 8; col += 1) {
        boardEl.appendChild(this.#createSquare(state, { col, row }, highlight));
      }
    }
  }

  /**
   * Collect CSS highlight categories for the current selection.
   * @returns {{selected:object|null, targets:object[], must:object[], path:object[]}}
   * @private
   */
  #buildHighlightSet(selection, legalMoves) {
    const must = selection.multiJumpActive
      ? []
      : MoveValidator.capturableStarts(legalMoves);
    return {
      selected: selection.selected,
      targets: selection.targets,
      must,
      path: selection.partialPath,
    };
  }

  /**
   * @param {GameState} state
   * @param {object} square
   * @param {object} highlight
   * @returns {HTMLButtonElement|HTMLDivElement}
   * @private
   */
  #createSquare(state, square, highlight) {
    const el = document.createElement("div");
    const playable = BoardUtils.isPlayable(square.col, square.row);
    el.className = `square ${playable ? "dark" : "light"}`;
    el.dataset.col = String(square.col);
    el.dataset.row = String(square.row);
    if (playable) {
      el.appendChild(this.#coordLabel(square));
      this.#applyHighlights(el, square, highlight);
      const piece = state.getPiece(square);
      if (piece) el.appendChild(this.#createPieceEl(piece));
    }
    return el;
  }

  /**
   * @param {object} square
   * @returns {HTMLSpanElement}
   * @private
   */
  #coordLabel(square) {
    const label = document.createElement("span");
    label.className = "coord";
    label.textContent = BoardUtils.formatSquare(square.col, square.row);
    return label;
  }

  /**
   * @param {HTMLElement} el
   * @param {object} square
   * @param {object} highlight
   * @returns {void}
   * @private
   */
  #applyHighlights(el, square, highlight) {
    if (BoardUtils.sameSquare(square, highlight.selected)) el.classList.add("selected");
    if (highlight.targets.some((sq) => BoardUtils.sameSquare(sq, square))) {
      el.classList.add("target");
    }
    if (highlight.must.some((sq) => BoardUtils.sameSquare(sq, square))) {
      el.classList.add("must-capture");
    }
    if (highlight.path.some((sq) => BoardUtils.sameSquare(sq, square))) {
      el.classList.add("in-path");
    }
  }

  /**
   * @param {object} piece
   * @returns {HTMLDivElement}
   * @private
   */
  #createPieceEl(piece) {
    const el = document.createElement("div");
    el.className = `piece ${piece.owner}`;
    if (piece.kind === Constants.KING) el.classList.add("king");
    el.setAttribute("aria-label", `${piece.owner} ${piece.kind}`);
    return el;
  }

  /**
   * @param {GameState} state
   * @param {object} selection
   * @param {Array<object>} legalMoves
   * @returns {void}
   */
  renderStatus(state, selection, legalMoves) {
    const turnName = state.sideToMove === Constants.DARK
      ? "Player 1 (Dark)"
      : "Player 2 (Light)";
    this.elements.status.innerHTML = this.#statusHtml(state, turnName);
    this.elements.hint.textContent = this.#hintText(state, selection, legalMoves);
  }

  /**
   * @param {GameState} state
   * @param {string} turnName
   * @returns {string}
   * @private
   */
  #statusHtml(state, turnName) {
    const result = this.#resultText(state);
    return [
      `<div><strong>Turn:</strong> ${turnName}</div>`,
      `<div><strong>Status:</strong> ${result}</div>`,
      `<div><strong>Forty-move counter:</strong> ${state.fortyMoveCounter}</div>`,
    ].join("");
  }

  /**
   * @param {GameState} state
   * @returns {string}
   * @private
   */
  #resultText(state) {
    if (state.status === Constants.STATUS_PLAYING) return "In progress";
    if (state.status === Constants.STATUS_DARK_WINS) return "Dark wins";
    if (state.status === Constants.STATUS_LIGHT_WINS) return "Light wins";
    return `Draw (${state.drawReason})`;
  }

  /**
   * @param {GameState} state
   * @param {object} selection
   * @param {Array<object>} legalMoves
   * @returns {string}
   * @private
   */
  #hintText(state, selection, legalMoves) {
    if (!state.isPlaying) return "Game over — press New Game to play again.";
    if (MoveValidator.hasMandatoryCaptures(state)) {
      if (selection.multiJumpActive) {
        return "Multi-jump in progress — continue jumping (green squares).";
      }
      return "Capture is mandatory — orange pieces must jump.";
    }
    if (selection.selected) return "Choose a green destination square.";
    return `Select one of your pieces (${legalMoves.length} legal move(s)).`;
  }

  /**
   * @param {GameState} state
   * @returns {void}
   */
  renderHistory(state) {
    const list = this.elements.historyList;
    list.innerHTML = "";
    state.moveLog.forEach((notation, index) => {
      const item = document.createElement("li");
      item.textContent = `${index + 1}. ${notation}`;
      list.appendChild(item);
    });
  }
}

/* ============================================================================
 * MODULE 8 — UIEventHandlers
 * ========================================================================== */

/**
 * Click and button handlers; enforces multi-jump completion in the UI.
 */
class UIEventHandlers {
  /**
   * @param {GameEngine} engine
   * @param {UIRenderer} renderer
   * @param {object} elements
   */
  constructor(engine, renderer, elements) {
    this.engine = engine;
    this.renderer = renderer;
    this.elements = elements;
    this.selection = this.#emptySelection();
  }

  /**
   * Wire DOM listeners and paint the first frame.
   * @returns {void}
   * @sideEffects Attaches listeners; renders UI
   */
  bind() {
    this.elements.board.addEventListener("click", (event) => this.onBoardClick(event));
    this.elements.newButton.addEventListener("click", () => this.onNewGame());
    this.elements.undoButton.addEventListener("click", () => this.onUndo());
    this.refresh();
  }

  /**
   * @returns {object}
   * @private
   */
  #emptySelection() {
    return {
      selected: null,
      partialPath: [],
      targets: [],
      multiJumpActive: false,
    };
  }

  /**
   * Recompute targets and re-render.
   * @returns {void}
   * @sideEffects Updates selection.targets and DOM
   */
  refresh() {
    this.#syncTargets();
    this.renderer.render(this.engine, this.selection);
  }

  /**
   * @returns {void}
   * @private
   */
  #syncTargets() {
    const legal = this.engine.legalMoves();
    const { selected, partialPath } = this.selection;
    if (!selected) {
      this.selection.targets = [];
      return;
    }
    if (this.selection.multiJumpActive || MoveValidator.hasMandatoryCaptures(this.engine.state)) {
      this.selection.targets = MoveValidator.nextLandingSquares(
        legal, selected, partialPath
      );
      return;
    }
    this.selection.targets = MoveValidator.quietTargetsFrom(legal, selected);
  }

  /**
   * Board click entry point.
   * @param {MouseEvent} event
   * @returns {void}
   */
  onBoardClick(event) {
    if (!this.engine.state.isPlaying) return;
    const squareEl = event.target.closest(".square.dark");
    if (!squareEl) return;
    const square = {
      col: Number(squareEl.dataset.col),
      row: Number(squareEl.dataset.row),
    };
    this.#handleSquareClick(square);
    this.refresh();
  }

  /**
   * @param {object} square
   * @returns {void}
   * @private
   */
  #handleSquareClick(square) {
    if (this.#isTargetSquare(square)) {
      this.#chooseTarget(square);
      return;
    }
    if (this.selection.multiJumpActive) return;
    this.#trySelectPiece(square);
  }

  /**
   * @param {object} square
   * @returns {boolean}
   * @private
   */
  #isTargetSquare(square) {
    return this.selection.targets.some((sq) => BoardUtils.sameSquare(sq, square));
  }

  /**
   * Select a piece if it belongs to the side to move and can move.
   * @param {object} square
   * @returns {void}
   * @private
   */
  #trySelectPiece(square) {
    const piece = this.engine.state.getPiece(square);
    if (!piece || piece.owner !== this.engine.state.sideToMove) {
      this.selection = this.#emptySelection();
      return;
    }
    const legal = this.engine.legalMoves();
    const canMove = legal.some((move) => BoardUtils.sameSquare(move.start, square));
    if (!canMove) {
      this.selection = this.#emptySelection();
      return;
    }
    this.selection = {
      selected: { ...square },
      partialPath: [],
      targets: [],
      multiJumpActive: false,
    };
  }

  /**
   * Extend a quiet move or capture path by one landing square.
   * @param {object} land
   * @returns {void}
   * @private
   */
  #chooseTarget(land) {
    const legal = this.engine.legalMoves();
    const start = this.selection.selected;
    if (!MoveValidator.hasMandatoryCaptures(this.engine.state) && !this.selection.multiJumpActive) {
      this.#commitQuiet(start, land, legal);
      return;
    }
    this.#commitCaptureStep(start, land, legal);
  }

  /**
   * @param {object} start
   * @param {object} land
   * @param {Array<object>} legal
   * @returns {void}
   * @private
   */
  #commitQuiet(start, land, legal) {
    const move = legal.find(
      (candidate) =>
        !candidate.isCapture &&
        BoardUtils.sameSquare(candidate.start, start) &&
        BoardUtils.sameSquare(candidate.path[0], land)
    );
    if (!move) return;
    this.engine.play(move);
    this.selection = this.#emptySelection();
  }

  /**
   * Append a jump landing; finish when the unique complete path is reached.
   * @param {object} start
   * @param {object} land
   * @param {Array<object>} legal
   * @returns {void}
   * @private
   */
  #commitCaptureStep(start, land, legal) {
    const partialPath = [...this.selection.partialPath, { ...land }];
    const finished = MoveValidator.completedMove(legal, start, partialPath);
    const nextLands = MoveValidator.nextLandingSquares(legal, start, partialPath);
    if (finished && nextLands.length === 0) {
      this.engine.play(finished);
      this.selection = this.#emptySelection();
      return;
    }
    this.selection.partialPath = partialPath;
    this.selection.multiJumpActive = true;
    this.selection.selected = { ...start };
  }

  /**
   * @returns {void}
   * @sideEffects Resets engine and selection
   */
  onNewGame() {
    this.engine.newGame();
    this.selection = this.#emptySelection();
    this.refresh();
  }

  /**
   * @returns {void}
   * @sideEffects Restores previous turn when possible
   */
  onUndo() {
    if (!this.engine.undo()) return;
    this.selection = this.#emptySelection();
    this.refresh();
  }
}

/* ============================================================================
 * Bootstrap
 * ========================================================================== */

/**
 * Construct modules and start the UI.
 * @returns {void}
 * @sideEffects Mounts the interactive game
 */
function bootGame() {
  const elements = {
    board: document.getElementById("board"),
    status: document.getElementById("status"),
    hint: document.getElementById("hint"),
    historyList: document.getElementById("history-list"),
    newButton: document.getElementById("btn-new"),
    undoButton: document.getElementById("btn-undo"),
  };
  const engine = new GameEngine();
  const renderer = new UIRenderer(elements);
  const handlers = new UIEventHandlers(engine, renderer, elements);
  handlers.bind();
}

bootGame();
</script>
